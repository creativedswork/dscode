<!-- OpenSpec change: add-interactive-plan-mode; revised 2026-08-29 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>dscode · Chat 原生意图对齐</title>
<style>
  :root {
    --bg: #f8f7f5;
    --surface: #f3f2ef;
    --surface-hover: #ebe9e5;
    --border: #e6e4e0;
    --text: #2d2a26;
    --muted: #8a8580;
    --secondary: #6b6560;
    --accent: #b87503;
    --accent-hover: #946002;
    --accent-bg: rgba(184, 117, 3, 0.12);
    --success: #edf4ed;
    --success-text: #347539;
    --warning: #fbf3db;
    --warning-text: #8a6500;
    --user: #ebe9e5;
    --radius-sm: 6px;
    --radius-md: 8px;
    --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-display: "Iowan Old Style", "Songti SC", Georgia, serif;
  }

  [data-theme="dark"] {
    --bg: #1e1c19;
    --surface: #282622;
    --surface-hover: #322e2a;
    --border: #3a3732;
    --text: #e8e4dd;
    --muted: #9a9590;
    --secondary: #b2aca5;
    --accent: #c98605;
    --accent-hover: #e5a50a;
    --accent-bg: rgba(201, 134, 5, 0.15);
    --success: #1a2e1a;
    --success-text: #72b978;
    --warning: #3a2e10;
    --warning-text: #d5a72a;
    --user: #322e2a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .shell {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    height: 100dvh;
    min-height: 0;
  }

  .sidebar {
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 8px 18px;
    font-family: var(--font-display);
    font-size: 17px;
  }
  .brand-mark {
    width: 12px;
    height: 12px;
    background: var(--accent);
    transform: rotate(45deg);
    border-radius: 2px;
  }
  .nav-label {
    margin: 10px 8px 5px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .nav-item {
    border: 0;
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--secondary);
    text-align: left;
  }
  .nav-item.active { background: var(--bg); color: var(--text); }
  .sidebar-spacer { flex: 1; }

  .app {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    min-width: 0;
    width: 100%;
    height: 42px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .top-title { font-size: 13px; font-weight: 600; }
  .top-status {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--success-text);
    font-size: 12px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .top-spacer { flex: 1; }
  .icon-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--secondary);
    background: var(--bg);
  }

  .prototype-bar {
    min-width: 0;
    width: 100%;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    overflow-x: auto;
  }
  .prototype-label {
    margin-right: 4px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .scene-btn {
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 4px 9px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .scene-btn[aria-selected="true"] {
    border-color: var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
  }

  .conversation {
    min-width: 0;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .thread {
    width: min(760px, calc(100% - 32px));
    margin: 0 auto;
    padding: 26px 0 34px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .message { min-width: 0; }
  .meta {
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
  }
  .user-message {
    align-self: flex-end;
    width: fit-content;
    max-width: 78%;
  }
  .user-message .meta { text-align: right; }
  .user-bubble {
    padding: 10px 13px;
    border-radius: var(--radius-md);
    background: var(--user);
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .assistant-message { max-width: 680px; }
  .assistant-copy {
    color: var(--text);
    font-size: 14px;
  }
  .assistant-copy strong { font-weight: 650; }
  .supporting {
    margin-top: 4px;
    color: var(--secondary);
    font-size: 13px;
  }

  .alignment {
    margin-top: 12px;
    border-left: 2px solid var(--accent);
    padding-left: 14px;
  }
  .alignment-title {
    margin: 0 0 4px;
    font-family: var(--font-display);
    font-size: 18px;
    line-height: 1.35;
  }
  .alignment-help {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 12px;
  }
  .options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .option {
    min-width: 0;
    min-height: 92px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    background: var(--bg);
    color: var(--text);
    text-align: left;
    transition: border-color .15s ease, background-color .15s ease, transform .15s ease;
  }
  .option:hover { border-color: var(--accent); background: var(--accent-bg); }
  .option:active { transform: translateY(1px); }
  .option[aria-checked="true"] {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .option-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 650;
  }
  .recommended {
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
  }
  .option-desc {
    color: var(--secondary);
    font-size: 12px;
    line-height: 1.45;
  }
  .alignment-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .custom-input {
    min-width: 0;
    flex: 1;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    background: var(--surface);
    color: var(--text);
  }
  .custom-input::placeholder { color: var(--muted); }
  .primary {
    flex: 0 0 auto;
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    background: var(--accent);
    color: #fffdf8;
    font-weight: 650;
  }
  .primary:hover { background: var(--accent-hover); }

  .activity {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 13px;
  }
  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }

  .plan-output,
  .todo-list {
    min-width: 0;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
  }
  .plan-output summary {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 12px;
    cursor: pointer;
    font-weight: 650;
  }
  .plan-output summary::before {
    content: "›";
    color: var(--muted);
  }
  .plan-output[open] summary::before { transform: rotate(90deg); }
  .plan-status {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
  }
  .plan-body {
    border-top: 1px solid var(--border);
    padding: 12px;
  }
  .plan-section + .plan-section { margin-top: 12px; }
  .plan-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }
  .plan-body p,
  .plan-body ol { margin: 4px 0 0; }
  .plan-body ol { padding-left: 20px; }
  .todo-list { padding: 11px 12px; }
  .todo-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 650;
  }
  .todo-status {
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
  }
  .todo-item {
    display: flex;
    align-items: baseline;
    gap: 7px;
    color: var(--secondary);
    font-size: 13px;
  }
  .todo-item + .todo-item { margin-top: 5px; }
  .todo-mark {
    width: 14px;
    flex: 0 0 14px;
    color: var(--muted);
    text-align: center;
  }
  .todo-item.completed .todo-mark { color: var(--success-text); }
  .todo-item.active {
    color: var(--text);
    font-weight: 600;
  }
  .todo-item.active .todo-mark { color: var(--accent); }

  .permission {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
    background: var(--surface);
  }
  .permission strong { display: block; margin-bottom: 3px; }
  .permission code { font-size: 12px; color: var(--secondary); }
  .permission-actions { display: flex; gap: 8px; margin-top: 10px; }
  .secondary {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    background: var(--bg);
    color: var(--text);
  }

  .composer {
    min-width: 0;
    width: 100%;
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 10px 16px 8px;
  }
  .composer-row {
    width: min(760px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 38px;
    gap: 8px;
  }
  .composer-input {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 9px 11px;
    background: var(--surface);
    color: var(--text);
  }
  .send {
    border: 0;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fffdf8;
    font-size: 18px;
  }
  .composer-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .topbar { padding-inline: 10px; }
    .prototype-bar { padding-inline: 10px; }
    .prototype-label { display: none; }
    .scene-btn { padding-inline: 7px; }
    .thread {
      width: 100%;
      padding: 18px 12px 28px;
    }
    .user-message { max-width: 88%; }
    .options { grid-template-columns: 1fr; }
    .option { min-height: 0; }
    .alignment-actions { align-items: stretch; flex-direction: column; }
    .primary { width: 100%; }
    .composer { padding-inline: 10px; }
  }

  @media (max-height: 360px) {
    .topbar { height: 36px; }
    .prototype-bar { padding-block: 4px; }
    .thread { padding-block: 12px 18px; gap: 14px; }
    .alignment { margin-top: 8px; }
    .alignment-help { margin-bottom: 8px; }
    .option { min-height: 70px; }
    .composer { padding-block: 7px 5px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="主导航">
    <div class="brand"><span class="brand-mark"></span><span>DSCode</span></div>
    <div class="nav-label">创建</div>
    <button class="nav-item active">对话</button>
    <button class="nav-item">会话</button>
    <div class="nav-label">能力</div>
    <button class="nav-item">MCP</button>
    <button class="nav-item">Skills</button>
    <div class="sidebar-spacer"></div>
    <button class="nav-item">设置</button>
  </aside>

  <main class="app">
    <header class="topbar">
      <div class="top-title">Chat</div>
      <div class="top-spacer"></div>
      <div class="top-status"><span class="dot"></span><span>已连接</span></div>
      <button id="theme-toggle" class="icon-btn" title="切换主题" aria-label="切换主题">◐</button>
    </header>

    <nav class="prototype-bar" aria-label="原型场景">
      <span class="prototype-label">原型场景</span>
      <button class="scene-btn" data-scene="align" aria-selected="true">待对齐</button>
      <button class="scene-btn" data-scene="resolved" aria-selected="false">已对齐</button>
      <button class="scene-btn" data-scene="plan" aria-selected="false">计划输出</button>
      <button class="scene-btn" data-scene="direct" aria-selected="false">直接执行</button>
      <button class="scene-btn" data-scene="permission" aria-selected="false">权限确认</button>
    </nav>

    <section class="conversation" aria-label="对话">
      <div id="thread" class="thread"></div>
    </section>

    <footer class="composer">
      <div class="composer-row">
        <input class="composer-input" aria-label="消息" placeholder="输入消息，@ 引用文件" />
        <button class="send" aria-label="发送" title="发送">↑</button>
      </div>
      <div class="composer-note">Enter 发送 · Shift+Enter 换行 · Esc 停止</div>
    </footer>
  </main>
</div>

<template id="scene-align">
  <article class="message user-message">
    <div class="meta">你</div>
    <div class="user-bubble">创建一个俄罗斯方块小游戏</div>
  </article>
  <article class="message assistant-message">
    <div class="meta">dscode</div>
    <div class="assistant-copy">先确认一下视觉方向。我建议从<strong>复古街机像素风</strong>开始，玩法辨识度高，也适合快速完成。</div>
    <div class="alignment">
      <h2 class="alignment-title">你希望它看起来是什么风格？</h2>
      <p class="alignment-help">这会影响配色、字体、动效和音效方向。</p>
      <div class="options" role="radiogroup" aria-label="视觉风格">
        <button class="option" role="radio" aria-checked="true" tabindex="0" data-value="复古街机像素风">
          <span class="option-head"><span>复古街机像素风</span><span class="recommended">推荐</span></span>
          <span class="option-desc">深色背景、清晰像素块、克制的 CRT 质感。</span>
        </button>
        <button class="option" role="radio" aria-checked="false" tabindex="-1" data-value="现代极简">
          <span class="option-head"><span>现代极简</span></span>
          <span class="option-desc">留白充足、几何方块、轻量过渡动画。</span>
        </button>
        <button class="option" role="radio" aria-checked="false" tabindex="-1" data-value="霓虹街机">
          <span class="option-head"><span>霓虹街机</span></span>
          <span class="option-desc">高对比色、发光边缘、强调连消反馈。</span>
        </button>
      </div>
      <div class="alignment-actions">
        <input id="custom-direction" class="custom-input" placeholder="或补充你的风格要求" aria-label="自定义风格" />
        <button id="confirm-direction" class="primary">采用此方向</button>
      </div>
    </div>
  </article>
</template>

<template id="scene-resolved">
  <article class="message user-message">
    <div class="meta">你</div>
    <div class="user-bubble">创建一个俄罗斯方块小游戏</div>
  </article>
  <article class="message assistant-message">
    <div class="meta">dscode</div>
    <div class="assistant-copy">采用<strong>复古街机像素风</strong>。我会保持黑色舞台、彩色方块和短促的消除反馈。</div>
  </article>
  <article class="message assistant-message">
    <div class="activity"><span class="pulse"></span><span>正在实现并验证游戏逻辑</span></div>
  </article>
</template>

<template id="scene-plan">
  <article class="message user-message">
    <div class="meta">你</div>
    <div class="user-bubble">采用霓虹街机风格，继续。</div>
  </article>
  <article class="message assistant-message">
    <div class="meta">dscode</div>
    <div class="assistant-copy">计划已生成</div>
  </article>
  <details class="plan-output">
    <summary>执行计划<span class="plan-status">已就绪</span></summary>
    <div class="plan-body">
      <div class="plan-section">
        <div class="plan-label">目标</div>
        <p>完成可直接游玩的霓虹街机俄罗斯方块。</p>
      </div>
      <div class="plan-section">
        <div class="plan-label">确定方案</div>
        <p>复用现有单文件实现，补齐 7-bag、SRS、锁定延迟、输入连发和响应式适配。</p>
      </div>
      <div class="plan-section">
        <div class="plan-label">范围</div>
        <p>仅修改 tetris.html，不新增依赖、不联网、不写入工作区外路径。</p>
      </div>
      <div class="plan-section">
        <div class="plan-label">执行与验证</div>
        <ol>
          <li>实现 7-bag、SRS、锁定延迟和计分规则，并运行规则检查。</li>
          <li>完成键盘操作、游戏状态反馈和桌面浏览器检查。</li>
          <li>完成触控布局、离线加载和移动端浏览器检查。</li>
        </ol>
      </div>
    </div>
  </details>
  <section class="todo-list" aria-label="TODO 执行清单">
    <div class="todo-head"><span>TODO</span><span class="todo-status">执行中 · 1/3</span></div>
    <div class="todo-item completed" aria-label="已完成：核心玩法可运行"><span class="todo-mark" aria-hidden="true">✓</span><span>核心玩法可运行</span></div>
    <div class="todo-item active" aria-label="执行中：桌面端游戏可玩"><span class="todo-mark" aria-hidden="true">◐</span><span>桌面端游戏可玩</span></div>
    <div class="todo-item" aria-label="待处理：移动端与离线交付可用"><span class="todo-mark" aria-hidden="true">○</span><span>移动端与离线交付可用</span></div>
  </section>
</template>

<template id="scene-direct">
  <article class="message user-message">
    <div class="meta">你</div>
    <div class="user-bubble">创建一个黑底、8-bit 像素风、支持键盘方向键的俄罗斯方块小游戏。</div>
  </article>
  <article class="message assistant-message">
    <div class="meta">dscode</div>
    <div class="assistant-copy">方向已经明确。我会直接实现核心玩法、计分、下一块预览和重新开始。</div>
  </article>
  <article class="message assistant-message">
    <div class="activity"><span class="pulse"></span><span>正在创建游戏文件</span></div>
  </article>
</template>

<template id="scene-permission">
  <article class="message user-message">
    <div class="meta">你</div>
    <div class="user-bubble">采用复古街机像素风，继续执行。</div>
  </article>
  <article class="message assistant-message">
    <div class="meta">dscode</div>
    <div class="assistant-copy">视觉方向已确认。写入项目文件前需要使用现有权限确认。</div>
    <div class="permission">
      <strong>允许写入工作区？</strong>
      <code>src/game/** · index.html · styles.css</code>
      <div class="permission-actions">
        <button class="primary">允许</button>
        <button class="secondary">拒绝</button>
      </div>
    </div>
  </article>
</template>

<script>
  const thread = document.getElementById("thread");
  const sceneButtons = [...document.querySelectorAll(".scene-btn")];
  let selectedDirection = "复古街机像素风";

  function render(scene) {
    const template = document.getElementById(`scene-${scene}`);
    thread.replaceChildren(template.content.cloneNode(true));
    sceneButtons.forEach((button) => {
      button.setAttribute("aria-selected", String(button.dataset.scene === scene));
    });
    if (scene === "align") bindAlignment();
  }

  function selectOption(options, index) {
    options.forEach((option, optionIndex) => {
      const selected = optionIndex === index;
      option.setAttribute("aria-checked", String(selected));
      option.tabIndex = selected ? 0 : -1;
    });
    selectedDirection = options[index].dataset.value;
  }

  function bindAlignment() {
    const options = [...thread.querySelectorAll(".option")];
    options.forEach((option, index) => {
      option.addEventListener("click", () => selectOption(options, index));
      option.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
        event.preventDefault();
        const delta = ["ArrowRight", "ArrowDown"].includes(event.key) ? 1 : -1;
        const next = (index + delta + options.length) % options.length;
        selectOption(options, next);
        options[next].focus();
      });
    });

    const custom = document.getElementById("custom-direction");
    document.getElementById("confirm-direction").addEventListener("click", () => {
      const value = custom.value.trim() || selectedDirection;
      render("resolved");
      const message = thread.querySelector(".assistant-copy");
      message.innerHTML = `采用<strong>${value}</strong>。我会把它作为明确约束继续实现。`;
    });
  }

  sceneButtons.forEach((button) => {
    button.addEventListener("click", () => {
      history.replaceState(null, "", `#${button.dataset.scene}`);
      render(button.dataset.scene);
    });
  });

  document.getElementById("theme-toggle").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });

  const requestedScene = location.hash.slice(1);
  const initialScene = sceneButtons.some((button) => button.dataset.scene === requestedScene)
    ? requestedScene
    : "align";
  render(initialScene);
</script>
</body>
</html>
