<!-- OpenSpec change: redesign-plan-executive-loop; generated 2026-09-18 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DSCode 执行控制状态</title>
<style>
  :root {
    --color-bg: #f8f7f5;
    --color-surface: #f3f2ef;
    --color-surface-hover: #ebe9e5;
    --color-border: #e6e4e0;
    --color-text: #2d2a26;
    --color-text-muted: #8a8580;
    --color-text-secondary: #6b6560;
    --color-accent: #b87503;
    --color-accent-hover: #946002;
    --color-accent-bg: rgba(184, 117, 3, 0.12);
    --color-success: #edf4ed;
    --color-success-text: #347539;
    --color-warning: #fbf3db;
    --color-warning-text: #8a6500;
    --color-error: #fdebec;
    --color-error-text: #9f2f2d;
    --color-user-bubble: #ebe9e5;
    --radius-sm: 6px;
    --radius-md: 8px;
    --font-sans: "Geist Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", monospace;
  }
  [data-theme="dark"] {
    --color-bg: #1e1c19;
    --color-surface: #282622;
    --color-surface-hover: #322e2a;
    --color-border: #3a3732;
    --color-text: #e8e4dd;
    --color-text-muted: #8a8580;
    --color-text-secondary: #9a9590;
    --color-accent: #c98605;
    --color-accent-hover: #e5a50a;
    --color-accent-bg: rgba(201, 134, 5, 0.15);
    --color-success: #1a2e1a;
    --color-success-text: #5ca860;
    --color-warning: #3a2e10;
    --color-warning-text: #d5a72a;
    --color-error: #3a1a1a;
    --color-error-text: #e05553;
    --color-user-bubble: #322e2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    background: var(--color-bg);
    color: var(--color-text);
    font: 14px/1.5 var(--font-sans);
    letter-spacing: 0;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .shell {
    display: grid;
    grid-template-columns: 224px minmax(0, 1fr);
    min-height: 100dvh;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 14px 12px;
    border-right: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .brand {
    padding: 0 8px 18px;
    font-weight: 650;
    font-size: 16px;
  }
  .nav {
    border: 0;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    background: transparent;
    color: var(--color-text-secondary);
    text-align: left;
  }
  .nav.active { background: var(--color-bg); color: var(--color-text); }
  .sidebar-space { flex: 1; }
  .app {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    height: 44px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .topbar strong { font-size: 13px; }
  .top-space { flex: 1; }
  .icon-button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-bg);
    color: var(--color-text-secondary);
  }
  .scenes {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    overflow-x: auto;
    border-bottom: 1px solid var(--color-border);
  }
  .scene {
    flex: 0 0 auto;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 5px 9px;
    background: transparent;
    color: var(--color-text-muted);
  }
  .scene[aria-selected="true"] {
    border-color: var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    font-weight: 600;
  }
  .conversation {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  .thread {
    width: min(760px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 36px;
  }
  .message { margin-bottom: 22px; }
  .meta {
    margin-bottom: 6px;
    color: var(--color-text-muted);
    font-size: 11px;
    font-weight: 600;
  }
  .user {
    width: fit-content;
    max-width: 78%;
    margin-left: auto;
  }
  .user .meta { text-align: right; }
  .bubble {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 10px 13px;
    background: var(--color-user-bubble);
  }
  .plan {
    margin-bottom: 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
  }
  .plan summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .plan-status {
    margin-left: auto;
    color: var(--color-text-muted);
    font-size: 12px;
    font-weight: 500;
  }
  .plan-body {
    padding: 0 12px 12px;
    color: var(--color-text-secondary);
  }
  .todo {
    margin-bottom: 16px;
    border-top: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
  }
  .todo-head, .todo-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 2px;
  }
  .todo-head {
    color: var(--color-text-muted);
    font-size: 12px;
  }
  .todo-head span:last-child { margin-left: auto; }
  .todo-row + .todo-row { border-top: 1px solid var(--color-border); }
  .mark {
    width: 18px;
    flex: 0 0 18px;
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    text-align: center;
  }
  .todo-row.active .mark { color: var(--color-accent); }
  .todo-row.done .mark { color: var(--color-success-text); }
  .todo-result {
    margin-top: 3px;
    color: var(--color-text-muted);
    font-size: 12px;
  }
  .activity, .notice {
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-accent);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    background: var(--color-surface);
  }
  .activity-title, .notice-title { font-weight: 650; }
  .activity-meta {
    margin-top: 4px;
    color: var(--color-text-muted);
    font: 12px/1.5 var(--font-mono);
  }
  .notice.warning {
    border-left-color: var(--color-warning-text);
    background: var(--color-warning);
  }
  .notice.success {
    border-left-color: var(--color-success-text);
    background: var(--color-success);
  }
  .notice-copy {
    margin-top: 5px;
    color: var(--color-text-secondary);
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .primary, .secondary {
    min-height: 34px;
    border-radius: var(--radius-sm);
    padding: 6px 12px;
  }
  .primary {
    border: 1px solid var(--color-accent);
    background: var(--color-accent);
    color: #fffdf8;
  }
  .primary:hover { background: var(--color-accent-hover); }
  .secondary {
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-text);
  }
  .composer {
    flex: 0 0 auto;
    padding: 10px 14px 8px;
    border-top: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .composer-row {
    width: min(760px, 100%);
    margin: 0 auto;
    display: flex;
    gap: 8px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 8px;
    background: var(--color-surface);
  }
  .composer input {
    min-width: 0;
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--color-text);
    font: inherit;
  }
  .send {
    width: 34px;
    border: 0;
    border-radius: var(--radius-sm);
    background: var(--color-accent);
    color: #fffdf8;
  }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .thread { width: 100%; padding: 18px 12px 28px; }
    .user { max-width: 88%; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
    .composer { padding-inline: 10px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="主导航">
    <div class="brand">DSCode</div>
    <button class="nav active">对话</button>
    <button class="nav">会话</button>
    <button class="nav">MCP</button>
    <button class="nav">Skills</button>
    <div class="sidebar-space"></div>
    <button class="nav">设置</button>
  </aside>
  <main class="app">
    <header class="topbar">
      <strong>Chat</strong>
      <div class="top-space"></div>
      <button id="theme" class="icon-button" title="切换主题" aria-label="切换主题">◐</button>
    </header>
    <nav class="scenes" aria-label="执行状态">
      <button class="scene" data-scene="running" aria-selected="true">执行中</button>
      <button class="scene" data-scene="reflecting" aria-selected="false">正在反思</button>
      <button class="scene" data-scene="paused" aria-selected="false">自动暂停</button>
      <button class="scene" data-scene="completed" aria-selected="false">已完成</button>
    </nav>
    <section class="conversation" aria-label="对话">
      <div id="thread" class="thread"></div>
    </section>
    <footer class="composer">
      <div class="composer-row">
        <input aria-label="消息" placeholder="输入消息，@ 引用文件">
        <button class="send" title="发送" aria-label="发送">↑</button>
      </div>
    </footer>
  </main>
</div>

<template id="base">
  <article class="message user">
    <div class="meta">你</div>
    <div class="bubble">实现一个俄罗斯方块小游戏</div>
  </article>
  <details class="plan">
    <summary>执行计划<span class="plan-status"></span></summary>
    <div class="plan-body">目标：交付可直接游玩的俄罗斯方块。当前策略：先完成核心玩法，再验证运行结果。</div>
  </details>
  <section class="todo" aria-label="任务进度">
    <div class="todo-head"><strong>TODO</strong><span class="todo-count"></span></div>
    <div class="todo-row active">
      <span class="mark">◐</span>
      <div><strong>核心游戏可玩</strong><div class="todo-result">移动、旋转、消行和计分仍在验证</div></div>
    </div>
    <div class="todo-row">
      <span class="mark">○</span>
      <div><strong>桌面与移动操作可用</strong></div>
    </div>
  </section>
  <article class="message assistant">
    <div class="meta">dscode</div>
    <div class="state-slot"></div>
  </article>
</template>

<script>
  const thread = document.getElementById("thread");
  const sceneButtons = [...document.querySelectorAll(".scene")];
  const states = {
    running: {
      plan: "执行中",
      count: "0/2",
      html: '<div class="activity"><div class="activity-title">正在执行核心玩法</div><div class="activity-meta">本轮 4/12 次工具调用 · 已通过 1/3 项验证</div></div>'
    },
    reflecting: {
      plan: "调整策略",
      count: "0/2",
      html: '<div class="notice warning"><div class="notice-title">当前方法没有产生新的验证结果</div><div class="notice-copy">系统正在进行一次策略调整。调整期间不会继续修改文件。</div><div class="activity-meta">重复结果：3 次 · 新增验证：0</div></div>'
    },
    paused: {
      plan: "自动执行已暂停",
      count: "0/2 · 未验证",
      html: '<div class="notice warning"><div class="notice-title">自动执行已暂停</div><div class="notice-copy">连续执行没有产生新的验证结果。当前成果仍在进行中，未标记为失败或完成。</div><div class="actions"><button class="primary">调整方案</button><button class="secondary">继续执行</button></div></div>'
    },
    completed: {
      plan: "已完成",
      count: "2/2",
      html: '<div class="notice success"><div class="notice-title">任务已完成</div><div class="notice-copy">核心玩法和操作方式已通过计划中的验证。最终报告将列出交付结果和未覆盖范围。</div></div>'
    }
  };

  function render(scene) {
    const fragment = document.getElementById("base").content.cloneNode(true);
    const state = states[scene];
    fragment.querySelector(".plan-status").textContent = state.plan;
    fragment.querySelector(".todo-count").textContent = state.count;
    fragment.querySelector(".state-slot").innerHTML = state.html;
    if (scene === "completed") {
      fragment.querySelectorAll(".todo-row").forEach((row) => {
        row.className = "todo-row done";
        row.querySelector(".mark").textContent = "✓";
      });
      fragment.querySelector(".todo-result").textContent = "核心规则验证通过";
    }
    thread.replaceChildren(fragment);
    sceneButtons.forEach((button) => {
      button.setAttribute("aria-selected", String(button.dataset.scene === scene));
    });
  }

  sceneButtons.forEach((button) => {
    button.addEventListener("click", () => {
      history.replaceState(null, "", `#${button.dataset.scene}`);
      render(button.dataset.scene);
    });
  });
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  });
  render(states[location.hash.slice(1)] ? location.hash.slice(1) : "running");
</script>
</body>
</html>
