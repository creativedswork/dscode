  <g transform="translate(1000 420)">
    <rect width="120" height="120" rx="28" fill="#161b22"/>
    <rect x="10" y="10" width="100" height="100" rx="20" stroke="#30363d" stroke-width="2"/>
    <path d="M26 30H56C75 30 90 45 90 64C90 83 75 98 56 98H26V30ZM44 47V81H56C65 81 73 73 73 64C73 55 65 47 56 47H44Z" fill="#f0f6fc"/>
    <path d="M93 37H73C65 37 58 44 58 52C58 59 63 64 72 65L81 66C91 68 98 73 98 82C98 93 89 101 78 101H48" stroke="url(#swish)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="84" y="24" width="12" height="12" rx="4" fill="#68E7FF"/>
    <rect x="98" y="115" width="9" height="9" rx="3" fill="#6EEB47"/>
    <rect x="21" y="104" width="7" height="7" rx="2" fill="#7C89FF"/>
