<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68E7FF"/>
      <stop offset="0.5" stop-color="#7C89FF"/>
      <stop offset="1" stop-color="#6EEB47"/>
    </linearGradient>
    <linearGradient id="swish" x1="80" y1="48" x2="160" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68E7FF"/>
      <stop offset="0.52" stop-color="#7C89FF"/>
      <stop offset="1" stop-color="#6EEB47"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" rx="24" fill="#0d1117"/>

  <!-- Decorative glow -->
  <circle cx="200" cy="160" r="300" fill="#68E7FF" opacity="0.03"/>
  <circle cx="1080" cy="480" r="280" fill="#6EEB47" opacity="0.03"/>

  <!-- Top line -->
  <rect x="80" y="80" width="1120" height="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Brand label -->
  <text x="80" y="150" fill="#8b949e" font-size="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="500" letter-spacing="8">DSCODE</text>

  <!-- Title -->
  <text x="80" y="280" fill="#f0f6fc" font-size="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-3">DeepSeek Agent</text>
  <text x="80" y="370" fill="#f0f6fc" font-size="88" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-3">for Digital Work</text>

  <!-- Underline -->
  <rect x="80" y="400" width="480" height="6" rx="3" fill="url(#accent)"/>

  <!-- Description -->
  <text x="80" y="470" fill="#8b949e" font-size="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="400">The open source MCP-first AI agent for DeepSeek —</text>
  <text x="80" y="515" fill="#8b949e" font-size="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="400">terminal or browser, one agent harness.</text>

  <!-- Bottom line -->
