<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITLE — short descriptor</title>
  <style>
    :root {
      --ivory:    #FAF9F5;
      --slate:    #141413;
      --clay:     #D97757;
      --clay-d:   #B85C3E;
      --oat:      #E3DACC;
      --olive:    #788C5D;
      --gray-150: #F0EEE6;
      --gray-300: #D1CFC5;
      --gray-500: #87867F;
      --gray-700: #3D3D3A;
      --white:    #FFFFFF;
      --serif: ui-serif, Georgia, 'Times New Roman', serif;
      --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono:  ui-monospace, 'SF Mono', Menlo, Monaco, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      background: var(--ivory);
      color: var(--gray-700);
      line-height: 1.55;
      padding: 56px 32px 120px;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1120px; margin: 0 auto; }

    /* header */
    header.page-head { margin-bottom: 48px; max-width: 820px; }
    .eyebrow {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gray-500); margin-bottom: 12px;
    }
    h1 {
      font-family: var(--serif); font-weight: 500; font-size: 38px;
      line-height: 1.15; color: var(--slate); margin-bottom: 18px;
      letter-spacing: -0.01em;
    }
    .prompt-box {
      background: var(--gray-150); border: 1.5px solid var(--gray-300);
      border-radius: 12px; padding: 16px 20px; font-size: 14.5px;
    }
    .prompt-box .label {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--gray-500); display: block; margin-bottom: 6px;
    }

    /* summary strip */
    .summary {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 64px;
    }
    @media (max-width: 900px) { .summary { grid-template-columns: repeat(2, 1fr); } }
    .summary .cell {
      background: var(--white); border: 1.5px solid var(--gray-300);
      border-radius: 12px; padding: 18px 20px;
    }
    .summary .k {
      font-family: var(--mono); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--gray-500); margin-bottom: 6px;
    }
    .summary .v { font-size: 17px; color: var(--slate); font-weight: 600; }
    .summary .v.accent { color: var(--clay); }

    /* sections */
    section { margin-bottom: 64px; }
    .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
    .sec-head .num {
      font-family: var(--mono); font-size: 12px; background: var(--oat);
      color: var(--slate); padding: 3px 9px; border-radius: 8px;
    }
    .sec-head h2 {
      font-family: var(--serif); font-weight: 500; font-size: 26px;
      color: var(--slate); letter-spacing: -0.01em;
    }
    .sec-intro { font-size: 14.5px; color: var(--gray-500); max-width: 720px; margin-bottom: 28px; }

    /* common blocks */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--gray-300); }
    th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-500); }
    pre {
      background: var(--slate); color: #E8E6DE; border-radius: 10px;
      padding: 16px 18px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.5;
    }
    .callout {
      border-left: 3px solid var(--clay); background: var(--gray-150);
      padding: 14px 18px; border-radius: 0 10px 10px 0; margin: 18px 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-head">
      <div class="eyebrow">CATEGORY · DATE</div>
      <h1>Document title goes here</h1>
      <div class="prompt-box">
        <span class="label">Prompt</span>
        Echo the request that generated this document here.
      </div>
    </header>

    <div class="summary">
      <div class="cell"><div class="k">Key</div><div class="v accent">Value</div></div>
      <div class="cell"><div class="k">Key</div><div class="v">Value</div></div>
      <div class="cell"><div class="k">Key</div><div class="v">Value</div></div>
      <div class="cell"><div class="k">Key</div><div class="v">Value</div></div>
    </div>

    <section>
      <div class="sec-head"><span class="num">01</span><h2>Section title</h2></div>
      <p class="sec-intro">One-line framing of what this section covers.</p>
      <!-- content: paragraphs, tables, <pre> snippets, inline SVG, .callout -->
    </section>
  </div>
</body>
</html>
