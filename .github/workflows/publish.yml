name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $GITHUB_REF_NAME"
            exit 1
          fi
          VERSION="$VERSION" node --eval '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      - name: Ensure npm version is unpublished
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists on npm"
            exit 1
          fi
      - run: node scripts/build.mjs

      - name: Pack npm artifact
        run: |
          mkdir -p release/artifacts
          npm pack ./release/package --pack-destination release/artifacts

      - name: Verify exact npm artifact
        run: node scripts/verify-package.mjs release/artifacts/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/artifacts/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: build-package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --global npm@11
      - run: npm publish ./package/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
